<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Character Studio</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #05030a; display: flex; justify-content: center; height: 100vh; color: #e2d8f3; }
    .app-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #0c0814; box-shadow: 0 0 30px rgba(124, 58, 237, 0.15); position: relative; }
    header { background: #120b20; padding: 10px 16px; border-bottom: 1px solid #23153c; display: flex; flex-direction: column; gap: 8px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; }
    .nav-btn { background: transparent; border: none; color: #a855f7; font-size: 1.2rem; cursor: pointer; padding: 4px; }
    .character-info { display: flex; align-items: center; gap: 10px; }
    .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #a855f7; }
    .character-names h2 { font-size: 0.95rem; color: #f3e8ff; font-weight: 600; }
    .stats-bar { display: flex; gap: 12px; background: #08050e; padding: 6px 12px; border-radius: 12px; border: 1px solid #1c1033; }
    .stat-item { flex: 1; display: flex; flex-direction: column; gap: 3px; font-size: 0.7rem; color: #a78bfa; }
    .progress-bg { width: 100%; height: 6px; background: #1e1333; border-radius: 3px; overflow: hidden; }
    .progress-fill-love { height: 100%; background: linear-gradient(90deg, #ef4444, #f43f5e); width: 65%; }
    .progress-fill-friend { height: 100%; background: linear-gradient(90deg, #06b6d4, #3b82f6); width: 40%; }
    #chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #05030a; }
    .ai-msg-wrapper { display: flex; gap: 10px; align-items: flex-end; max-width: 90%; }
    .ai-msg-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid #8b5cf6; flex-shrink: 0; }
    .message { padding: 12px 15px; border-radius: 16px; line-height: 1.5; word-wrap: break-word; font-size: 0.92rem; }
    .user { align-self: flex-end; max-width: 80%; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #ffffff; border-bottom-right-radius: 2px; }
    .ai { background: #150d27; color: #e2d8f3; border-bottom-left-radius: 2px; border: 1px solid #281947; }
    .dialogue { color: #ffffff !important; font-weight: 700; font-size: 0.98rem; }
    .action { color: #c4b5fd !important; font-size: 0.86rem; font-style: italic; opacity: 0.85; }
    .input-container { padding: 10px 14px; background: #120b20; border-top: 1px solid #23153c; }
    #input-area { display: flex; align-items: center; background: #08050e; padding: 4px 6px 4px 14px; border-radius: 24px; gap: 8px; border: 1px solid #2d1b4e; }
    input { flex: 1; border: none; background: transparent; outline: none; font-size: 0.9rem; color: #f3e8ff; }
    .btn-action { width: 36px; height: 36px; border-radius: 50%; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
    .send-btn { background: linear-gradient(135deg, #a855f7, #7c3aed); }
    .auto-btn { background: #23153c; color: #c084fc; border: 1px solid #3b2166; }
    .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0c0814; display: none; flex-direction: column; padding: 20px; z-index: 10; overflow-y: auto; }
    .modal.active { display: flex; }
    .modal-title { font-size: 1.2rem; font-weight: bold; color: #f3e8ff; margin-bottom: 15px; text-align: center; }
    .char-card { display: flex; align-items: center; gap: 12px; background: #150d27; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #281947; cursor: pointer; }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.8rem; color: #c084fc; }
    .form-group input, .form-group textarea { background: #150d27; border: 1px solid #281947; padding: 10px; border-radius: 8px; color: white; font-size: 0.9rem; outline: none; }
    .submit-btn { background: linear-gradient(135deg, #a855f7, #7c3aed); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-top">
        <button class="nav-btn" onclick="toggleModal('char-list-modal')"><i class="fa-solid fa-users"></i></button>
        <div class="character-info">
          <img id="current-avatar" class="avatar-img" src="" alt="Avatar">
          <div class="character-names">
            <h2 id="current-name">กำลังโหลด...</h2>
          </div>
        </div>
        <div>
          <button class="nav-btn" onclick="openKeyModal()" title="ตั้งค่า API Key"><i class="fa-solid fa-key"></i></button>
          <button class="nav-btn" onclick="clearCurrentChat()" title="ลบประวัติแชต"><i class="fa-solid fa-trash-can"></i></button>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat-item">
          <span>❤️ ความโรแมนติก (645)</span>
          <div class="progress-bg"><div class="progress-fill-love"></div></div>
        </div>
        <div class="stat-item">
          <span>🤝 ค่าความสนิท (118)</span>
          <div class="progress-bg"><div class="progress-fill-friend"></div></div>
        </div>
      </div>
    </header>
    <div id="chat-box"></div>
    <div class="input-container">
      <div id="input-area">
        <input type="text" id="user-input" placeholder="พิมพ์ข้อความ..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button class="btn-action auto-btn" onclick="autoContinue()" title="ให้ AI บรรยายเหตุการณ์ต่อ"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
        <button class="btn-action send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
    <div id="char-list-modal" class="modal">
      <div class="modal-title">เลือกตัวละครที่ต้องการคุย</div>
      <div id="character-list"></div>
      <button class="submit-btn" onclick="toggleModal('create-char-modal')">+ สร้างตัวละครใหม่</button>
      <button class="submit-btn" style="background:#334155;" onclick="toggleModal('char-list-modal')">ปิด</button>
    </div>
    <div id="create-char-modal" class="modal">
      <div class="modal-title">สร้างตัวละครใหม่</div>
      <div class="form-group">
        <label>ชื่อตัวละคร & บทบาท</label>
        <input type="text" id="new-char-name" placeholder="เช่น บิ๊ก | รุ่นพี่สมัยเด็ก">
      </div>
      <div class="form-group">
        <label>URL รูปภาพโปรไฟล์</label>
        <input type="text" id="new-char-avatar" placeholder="วางลิงก์รูปภาพ (.jpg / .png)">
      </div>
      <div class="form-group">
        <label>นิสัย / คำสั่ง Prompt ตัวละคร</label>
        <textarea id="new-char-prompt" rows="5" placeholder="ใส่นิสัย การใช้คำพูด..."></textarea>
      </div>
      <button class="submit-btn" onclick="createNewCharacter()">สร้างตัวละครเลย!</button>
      <button class="submit-btn" style="background:#334155;" onclick="toggleModal('create-char-modal')">ยกเลิก</button>
    </div>
    <div id="api-key-modal" class="modal">
      <div class="modal-title">ตั้งค่า Gemini API Key</div>
      <div class="form-group">
        <label>วาง Gemini API Key ของคุณที่นี่</label>
        <input type="password" id="api-key-input" placeholder="AIzaSy...">
      </div>
      <button class="submit-btn" onclick="saveApiKey()">บันทึก API Key</button>
      <button class="submit-btn" style="background:#334155;" onclick="toggleModal('api-key-modal')">ปิด</button>
    </div>
  </div>
  <script>
    const defaultCharacters = [{ id: "char_big", name: "บิ๊ก | รุ่นพี่สมัยเด็ก 🔥", avatar: "https://picsum.photos/id/1005/200", prompt: `คุณคือ "บิ๊ก" รุ่นพี่สมัยเด็ก ดุดัน ขี้หึงรุนแรง คลั่งรัก ใช้คำว่า "กู/มึง"\n[กฎสำคัญ]:\n1. คำพูดตัวละครใส่ในเครื่องหมาย "..." เสมอ\n2. การกระทำ/สีหน้า/บรรยากาศ ใส่ในเครื่องหมาย (...) เสมอ` }];
    let characters = JSON.parse(localStorage.getItem("ai_characters")) || defaultCharacters;
    let activeCharId = localStorage.getItem("active_char_id") || characters[0].id;
    let apiKey = localStorage.getItem("gemini_api_key") || "";
    window.onload = function() { saveCharacters(); loadActiveCharacter(); if (!apiKey) openKeyModal(); };
    function saveCharacters() { localStorage.setItem("ai_characters", JSON.stringify(characters)); localStorage.setItem("active_char_id", activeCharId); }
    function openKeyModal() { document.getElementById("api-key-input").value = apiKey; toggleModal('api-key-modal'); }
    function saveApiKey() { const input = document.getElementById("api-key-input").value.trim(); if (!input) return alert("กรุณากรอก API Key ครับ"); apiKey = input; localStorage.setItem("gemini_api_key", apiKey); alert("บันทึก API Key เรียบร้อยแล้ว!"); toggleModal('api-key-modal'); }
    function toggleModal(modalId) { const modal = document.getElementById(modalId); modal.classList.toggle("active"); if (modalId === 'char-list-modal') renderCharacterList(); }
    function renderCharacterList() { const container = document.getElementById("character-list"); container.innerHTML = ""; characters.forEach(c => { container.innerHTML += `<div class="char-card" onclick="selectCharacter('${c.id}')"><img class="avatar-img" src="${c.avatar}"><div><div style="font-weight:bold; color:#f3e8ff;">${c.name}</div><div style="font-size:0.75rem; color:#a78bfa;">กดเพื่อเริ่มการสนทนา</div></div></div>`; }); }
    function selectCharacter(id) { activeCharId = id; saveCharacters(); loadActiveCharacter(); toggleModal('char-list-modal'); }
    function createNewCharacter() { const name = document.getElementById("new-char-name").value.trim(); const avatar = document.getElementById("new-char-avatar").value.trim() || "https://picsum.photos/200"; const prompt = document.getElementById("new-char-prompt").value.trim(); if (!name || !prompt) return alert("กรุณากรอกชื่อและนิสัยตัวละครให้ครบครับ"); const newChar = { id: "char_" + Date.now(), name: name, avatar: avatar, prompt: prompt + `\n[กฎสำคัญ]: 1. คำพูดตัวละครใส่ในเครื่องหมาย "..." เสมอ 2. การกระทำ/บรรยากาศ ใส่ใน (...) เสมอ` }; characters.push(newChar); activeCharId = newChar.id; saveCharacters(); loadActiveCharacter(); document.getElementById("new-char-name").value = ""; document.getElementById("new-char-avatar").value = ""; document.getElementById("new-char-prompt").value = ""; toggleModal('create-char-modal'); toggleModal('char-list-modal'); }
    function getActiveChar() { return characters.find(c => c.id === activeCharId) || characters[0]; }
    function loadActiveCharacter() { const char = getActiveChar(); document.getElementById("current-name").innerText = char.name; document.getElementById("current-avatar").src = char.avatar; renderHistory(); }
    function getHistoryKey() { return "chat_history_" + activeCharId; }
    function getChatHistory() { return JSON.parse(localStorage.getItem(getHistoryKey())) || []; }
    function formatMessageText(text) { let formatted = text.replace(/"([^"]+)"/g, '<span class="dialogue">"$1"</span>'); formatted = formatted.replace(/\(([^)]+)\)/g, '<span class="action">($1)</span>'); return formatted; }
    function renderHistory() { const chatBox = document.getElementById("chat-box"); const history = getChatHistory(); const char = getActiveChar(); chatBox.innerHTML = ""; history.forEach(item => { if (item.sender === "user") { chatBox.innerHTML += `<div class="message user">${item.text}</div>`; } else { chatBox.innerHTML += `<div class="ai-msg-wrapper"><img class="ai-msg-avatar" src="${char.avatar}"><div class="message ai">${formatMessageText(item.text)}</div></div>`; } }); chatBox.scrollTop = chatBox.scrollHeight; }
    function saveMessage(sender, text) { const history = getChatHistory(); history.push({ sender, text }); localStorage.setItem(getHistoryKey(), JSON.stringify(history)); }
    function clearCurrentChat() { if (confirm("ลบประวัติการคุยกับตัวละครนี้ใช่ไหม?")) { localStorage.removeItem(getHistoryKey()); renderHistory(); } }
    async function sendMessage() { const inputField = document.getElementById("user-input"); const message = inputField.value.trim(); if (!message) return; if (!apiKey) { alert("กรุณาใส่ API Key ก่อนใช้งานครับ"); openKeyModal(); return; } saveMessage("user", message); inputField.value = ""; renderHistory(); await fetchAIReply(); }
    async function autoContinue() { if (!apiKey) { alert("กรุณาใส่ API Key ก่อนใช้งานครับ"); openKeyModal(); return; } const chatBox = document.getElementById("chat-box"); const history = getChatHistory(); history.push({ sender: "user", text: "[คำสั่งระบบ: ดำเนินเรื่องราว บรรยายการกระทำ อารมณ์ และบทสนทนาต่อไปของคุณได้เลย โดยไม่ต้องรอการตอบกลับจากฉัน]" }); const char = getActiveChar(); const aiWrapper = document.createElement("div"); aiWrapper.className = "ai-msg-wrapper"; aiWrapper.id = "temp-loading"; aiWrapper.innerHTML = `<img class="ai-msg-avatar" src="${char.avatar}"><div class="message ai">กำลังบรรยายต่อ...</div>`; chatBox.appendChild(aiWrapper); chatBox.scrollTop = chatBox.scrollHeight; try { const contents = history.map(item => ({ role: item.sender === "user" ? "user" : "model", parts: [{ text: item.text }] })); const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system_instruction: { parts: [{ text: char.prompt }] }, contents: contents }) }); const data = await response.json(); const rawAiReply = data.candidates[0].content.parts[0].text; document.getElementById("temp-loading")?.remove(); saveMessage("ai", rawAiReply); renderHistory(); } catch (error) { document.getElementById("temp-loading")?.remove(); chatBox.innerHTML += `<div class="message ai">เกิดข้อผิดพลาดในการเชื่อมต่อ API Key</div>`; } }
    async function fetchAIReply() { const chatBox = document.getElementById("chat-box"); const char = getActiveChar(); const aiWrapper = document.createElement("div"); aiWrapper.className = "ai-msg-wrapper"; aiWrapper.id = "temp-loading"; aiWrapper.innerHTML = `<img class="ai-msg-avatar" src="${char.avatar}"><div class="message ai">กำลังพิมพ์...</div>`; chatBox.appendChild(aiWrapper); chatBox.scrollTop = chatBox.scrollHeight; try { const history = getChatHistory(); const contents = history.map(item => ({ role: item.sender === "user" ? "user" : "model", parts: [{ text: item.text }] })); const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system_instruction: { parts: [{ text: char.prompt }] }, contents: contents }) }); const data = await response.json(); const rawAiReply = data.candidates[0].content.parts[0].text; document.getElementById("temp-loading")?.remove(); saveMessage("ai", rawAiReply); renderHistory(); } catch (error) { document.getElementById("temp-loading")?.remove(); chatBox.innerHTML += `<div class="message ai">เกิดข้อผิดพลาดในการเชื่อมต่อ API Key</div>`; } chatBox.scrollTop = chatBox.scrollHeight; }
  </script>
</body>
</html>
